<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>July Revelation 24</title>
<style>
body{margin:0;font-family:Arial,'Noto Sans Bengali',sans-serif;background:#f5f6f8;color:#111}
.wrap{max-width:1100px;margin:auto;padding:16px}
header{background:#c40018;color:white;padding:18px}.brand{font-size:28px;font-weight:800}
nav{background:#111;color:#fff;padding:10px}.nav{max-width:1100px;margin:auto;display:flex;gap:18px;overflow:auto;white-space:nowrap}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.hero{background:#fff;border-radius:8px;overflow:hidden;border:1px solid #ddd}.hero img{width:100%;max-height:520px;object-fit:cover}.hero div{padding:18px}
.tag{color:#c40018;font-weight:bold}.meta{color:#777;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover}.card div{padding:12px}.card h2{font-size:18px;line-height:1.5;margin:5px 0}
@media(max-width:700px){.grid{grid-template-columns:1fr}.brand{font-size:23px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">July Revelation 24</div><div>সত্যের সন্ধানে, মানুষের পাশে</div></div></header>
<nav><div class="nav"><span>প্রচ্ছদ</span><span>সর্বশেষ</span><span>জাতীয়</span><span>রাজনীতি</span><span>সারাদেশ</span><span>শিক্ষা</span><span>চাকরি</span><span>খেলাধুলা</span></div></nav>
<main>
<section id="hero"></section>
<h2>সর্বশেষ সংবাদ</h2>
<section id="news" class="grid"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function load(){
 const {data,error}=await db.from('posts').select('*').eq('published',true).order('created_at',{ascending:false});
 if(error){document.getElementById('news').innerHTML='<p>সংবাদ লোড করা যাচ্ছে না। Supabase সেটআপ সম্পূর্ণ হয়েছে কি না দেখুন।</p>';return}
 if(!data?.length){document.getElementById('hero').innerHTML='<div class="hero"><div><h1>July Revelation 24</h1><p>প্রথম সংবাদটি Admin Panel থেকে প্রকাশ করুন।</p></div></div>';return}
 const first=data[0];
 document.getElementById('hero').innerHTML=`<article class="hero">${first.image_url?`<img src="${first.image_url}" alt="">`:''}<div><span class="tag">${first.category||'সর্বশেষ'}</span><h1>${esc(first.title)}</h1><p class="meta">${new Date(first.created_at).toLocaleString('bn-BD')}</p><p>${esc(first.content)}</p></div></article>`;
 document.getElementById('news').innerHTML=data.slice(1).map(p=>`<article class="card">${p.image_url?`<img src="${p.image_url}" alt="">`:''}<div><span class="tag">${esc(p.category||'সর্বশেষ')}</span><h2>${esc(p.title)}</h2><p>${esc(p.content).slice(0,180)}</p><p class="meta">${new Date(p.created_at).toLocaleString('bn-BD')}</p></div></article>`).join('');
}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();
</script>
</body>
</html>
