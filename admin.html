<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | July Revelation 24</title>
<style>
body{font-family:Arial,'Noto Sans Bengali',sans-serif;background:#f3f4f6;margin:0}.box{max-width:650px;margin:30px auto;background:white;padding:22px;border-radius:10px;box-shadow:0 2px 12px #ddd}h1{color:#c40018}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:6px;font-size:15px;box-sizing:border-box}button{background:#c40018;color:#fff;border:0;padding:12px 18px;border-radius:6px;font-weight:bold}button.gray{background:#555}.delete{background:#b00020;padding:7px 12px;margin-top:6px}.hide{display:none}.post{border-top:1px solid #ddd;padding:12px 0}.msg{padding:10px;background:#f5f5f5;margin:10px 0;border-radius:6px}
</style></head><body><div class="box"><h1>July Revelation 24</h1>
<section id="loginSection"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="doLogin()">Login</button><div id="loginMsg" class="msg"></div></section>
<section id="panel" class="hide"><h2>নতুন নিউজ প্রকাশ করুন</h2><input id="title" placeholder="নিউজের শিরোনাম">
<select id="category"><option>সর্বশেষ</option><option>জাতীয়</option><option>রাজনীতি</option><option>সারাদেশ</option><option>আন্তর্জাতিক</option><option>শিক্ষা</option><option>চাকরি</option><option>খেলাধুলা</option><option>মতামত</option></select>
<input id="image" type="file" accept="image/*"><textarea id="content" rows="10" placeholder="নিউজের বিস্তারিত লিখুন"></textarea><input id="editId" type="hidden"><label><input id="published" type="checkbox" checked> এখনই Publish</label><br><br>
<button id="publishBtn" onclick="publish()">Publish News</button> <button id="cancelEditBtn" class="gray hide" onclick="cancelEdit()">Cancel Edit</button> <button class="gray" onclick="logout()">Logout</button><div id="msg" class="msg"></div><h2>সাম্প্রতিক নিউজ</h2><div id="list"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function doLogin(){const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});document.getElementById('loginMsg').textContent=error?error.message:'লগইন সফল';if(!error)showPanel()}
async function showPanel(){const {data:{session}}=await db.auth.getSession();if(session){document.getElementById('loginSection').classList.add('hide');document.getElementById('panel').classList.remove('hide');load()}}
async function logout(){await db.auth.signOut();location.reload()}
async function publish(){const {data:{user}}=await db.auth.getUser();if(!user)return;let url=null;const f=document.getElementById('image').files[0];if(f){const ext=f.name.split('.').pop().toLowerCase();const path=user.id+'/'+Date.now()+'.'+ext;const up=await db.storage.from('news-images').upload(path,f,{upsert:false});if(up.error){document.getElementById('msg').textContent=up.error.message;return}url=db.storage.from('news-images').getPublicUrl(path).data.publicUrl}const payload={title:document.getElementById('title').value,category:document.getElementById('category').value,content:document.getElementById('content').value,published:document.getElementById('published').checked};if(url)payload.image_url=url;const editId=document.getElementById('editId').value;let error;if(editId){({error}=await db.from('posts').update(payload).eq('id',editId).eq('author_id',user.id));document.getElementById('msg').textContent=error?error.message:'নিউজ সফলভাবে আপডেট হয়েছে।'}else{payload.image_url=url;payload.author_id=user.id;({error}=await db.from('posts').insert(payload));document.getElementById('msg').textContent=error?error.message:'নিউজ সফলভাবে প্রকাশ হয়েছে।'}if(!error){cancelEdit();document.getElementById('title').value='';document.getElementById('content').value='';document.getElementById('image').value='';load()}}
async function load(){const {data,error}=await db.from('posts').select('*').order('created_at',{ascending:false}).limit(10);if(error){document.getElementById('list').innerHTML='<div class="msg">'+esc(error.message)+'</div>';return}document.getElementById('list').innerHTML=(data||[]).map(p=>`<div class="post"><b>${esc(p.title)}</b><br><small>${esc(p.category||'')}</small><br><button onclick="editPost(${p.id})">✏️ Edit</button> <button class="delete" onclick="deletePost(${p.id})">🗑️ Delete</button></div>`).join('')}
async function editPost(id){const {data:p,error}=await db.from('posts').select('*').eq('id',id).single();if(error){document.getElementById('msg').textContent=error.message;return}document.getElementById('editId').value=p.id;document.getElementById('title').value=p.title||'';document.getElementById('category').value=p.category||'সর্বশেষ';document.getElementById('content').value=p.content||'';document.getElementById('published').checked=!!p.published;document.getElementById('publishBtn').textContent='Save Changes';document.getElementById('cancelEditBtn').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'});}
function cancelEdit(){document.getElementById('editId').value='';document.getElementById('publishBtn').textContent='Publish News';document.getElementById('cancelEditBtn').classList.add('hide');}
async function deletePost(id){if(!confirm('এই নিউজটি কি সত্যিই ডিলিট করতে চান?'))return;const {data:{user}}=await db.auth.getUser();if(!user)return;const {error}=await db.from('posts').delete().eq('id',id).eq('author_id',user.id);document.getElementById('msg').textContent=error?error.message:'নিউজ সফলভাবে ডিলিট হয়েছে।';if(!error)load()}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}showPanel();
</script></body></html>
